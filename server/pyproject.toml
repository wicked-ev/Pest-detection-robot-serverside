[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "pillow>=12.2.0",
    "python-multipart>=0.0.30",
    "rfdetr[plus]>=1.7.1",
    "sqlmodel>=0.0.38",
    "torch>=2.12.0",
    "uvicorn[standard]>=0.48.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A hung websocket test fails after this many seconds instead of blocking forever.
timeout = 30
# Tests marked slow load the real 121 MB model; run them with: pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: needs models/pest_model.pt and loads the real RF-DETR model"]
# Deprecated calls in our own code fail the tests, so they are fixed before they break.
# (Warnings raised inside libraries such as torch or rfdetr stay plain warnings.)
filterwarnings = [
    "error::DeprecationWarning:core",
    "error::DeprecationWarning:routers",
    "error::DeprecationWarning:main",
]
